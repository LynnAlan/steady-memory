name: Bug 报告
description: 使用合成数据报告可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传真实 vault、照片、健康数据、姓名、地址、凭据或 `.steady/` 内容。请使用最小合成数据复现。
        安全漏洞请不要创建公开 Issue，请使用仓库的 Security Advisory 私密报告。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认本 Issue、日志和附件不包含真实个人数据或凭据
          required: true
        - label: 我确认这不是需要私密报告的安全漏洞
          required: true
  - type: input
    id: version
    attributes:
      label: Steady Memory 版本或 commit
      placeholder: 例如 v0.1.0 或 597e34c
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: 例如 3.13.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      description: 使用合成名称、日期、数值和文件描述复现。
      placeholder: |
        1. 运行……
        2. 使用合成参数……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与脱敏错误信息
      description: 请再次确认内容已经脱敏。
    validations:
      required: true
